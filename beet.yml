name: Cleaner Rivers
version: 1.2.0

pipeline:
  - src.plugins.disk_clay
  - src.plugins.disk_sand
  - src.plugins.disk_gravel

meta:
  base_version: "1.21.9"
  overlay_versions:
    v26_1: "26.1"
    v26_3: "26.3"

data_pack:
  load: src/datapack
  description: {"text":"Cleaner Rivers\n1.21.9 - 26.3", "color":"gray"}
  min_format: 82
  max_format: 121
  overlays:
    - directory: v26_1
      min_format: 101
      max_format: 107
    - directory: v26_3
      min_format: 121
      max_format: 121

output: build
